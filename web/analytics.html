<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 策划案数据看板</title>
  <link rel="stylesheet" href="/web/portal.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AI</span><span>AI 策划案数据看板</span></div>
    <nav class="top-actions"><a href="/web/index.html">返回工作台</a></nav>
  </header>
  <main class="page">
    <div class="title-row">
      <div><div class="eyebrow">Local Analytics</div><h1>数据看板</h1><p class="subtitle">按本地运行快照统计生成效率、检查问题和界面任务。</p></div>
      <button class="button" id="refresh">刷新数据</button>
    </div>
    <section class="grid" id="metrics"></section>
    <section class="section panel">
      <h2>每日明细</h2>
      <div class="table-wrap"><table><thead><tr><th>日期</th><th>运行数</th><th>已导出</th><th>待澄清</th><th>检查记录</th></tr></thead><tbody id="daily"></tbody></table></div>
    </section>
    <section class="section panel">
      <h2>最近运行</h2>
      <div class="table-wrap"><table><thead><tr><th>时间</th><th>需求</th><th>结果</th><th>文档</th></tr></thead><tbody id="runs"></tbody></table></div>
    </section>
  </main>
  <script>
    const $=s=>document.querySelector(s);
    const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
    async function load(){const data=await(await fetch('/api/analytics')).json();const m=data.metrics;const cards=[['运行次数',m.runs,'本地管线调用'],['已导出',m.exported,'完成 Markdown 导出'],['待澄清',m.clarifications,'需要补充输入'],['文档数量',m.documents,'本地文档库'],['界面任务',m.visual_tasks,'页面拆分任务'],['检查记录',m.findings,'规则检查结果']];$('#metrics').innerHTML=cards.map(c=>'<div class="metric"><div class="metric-label">'+c[0]+'</div><div class="metric-value">'+c[1]+'</div><div class="metric-note">'+c[2]+'</div></div>').join('');$('#daily').innerHTML=data.daily.length?data.daily.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+r.runs+'</td><td>'+r.exported+'</td><td>'+r.clarifications+'</td><td>'+r.findings+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">暂无运行数据</td></tr>';$('#runs').innerHTML=data.recent_runs.length?data.recent_runs.map(r=>'<tr><td>'+esc(r.updated_at)+'</td><td>'+esc(r.request)+'</td><td><span class="badge '+(r.stage==='exported'?'success':'warning')+'">'+esc(r.stage)+'</span></td><td>'+esc(r.title||'—')+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无运行记录</td></tr>'}
    $('#refresh').onclick=load;
    load();
  </script>
</body>
</html>
