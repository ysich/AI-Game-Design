<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Coding 案生成</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>Coding 案生成</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/planner-test-cases.html">测试用例</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Local Coding Spec</div><h1>生成 Coding 案</h1><p class="subtitle">根据本地策划案生成研发可读的流程、界面、埋点和验收清单。</p></div></div><section class="panel"><div class="field"><label for="run">选择策划案运行记录</label><select id="run"></select></div><div style="margin-top:15px"><button class="primary" id="generate">生成 Coding 案</button><span class="status" id="status"></span></div></section><section class="section panel"><div class="title-row" style="margin-bottom:12px"><div><h2 style="margin:0">生成结果</h2><p class="subtitle" id="result-title">选择一次已导出的运行记录。</p></div><div class="top-actions"><button class="button" id="download" disabled>下载</button><button class="button" id="copy" disabled>复制</button></div></div><pre class="markdown" id="output">暂无结果</pre></section></main><script>const $=s=>document.querySelector(s);let result='';const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const runs=await(await fetch('/api/runs')).json();const exported=runs.filter(r=>r.document);$('#run').innerHTML=exported.length?exported.map(r=>'<option value="'+esc(r.id)+'">'+esc(r.document.title)+' · '+esc(r.id)+'</option>').join(''):'<option value="">暂无可用策划案</option>'}$('#generate').onclick=async()=>{if(!$('#run').value)return;$('#generate').disabled=true;$('#status').textContent='生成中…';const response=await fetch('/api/coding',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:$('#run').value})});const data=await response.json();if(response.ok){result=data.markdown;$('#output').textContent=result;$('#result-title').textContent=data.title+' · Coding 案';$('#download').disabled=false;$('#copy').disabled=false;$('#status').textContent='已生成'}else $('#status').textContent=data.error||'生成失败';$('#generate').disabled=false};$('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([result],{type:'text/markdown;charset=utf-8'}));a.download='coding-case.md';a.click();URL.revokeObjectURL(a.href)};$('#copy').onclick=async()=>{await navigator.clipboard.writeText(result);$('#status').textContent='已复制'};load();</script></body></html>
