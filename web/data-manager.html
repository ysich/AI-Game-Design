<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地数据管理</title>
  <link rel="stylesheet" href="/web/portal.css">
  <style>
    html,body{max-width:100%;overflow-x:hidden}
    .manager-tabs{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#f7f9fc}
    .manager-tab{min-width:108px;padding:8px 12px;border:0;border-radius:6px;color:var(--muted);background:transparent;font-size:12px;cursor:pointer}
    .manager-tab.active{color:var(--ink);background:#fff;box-shadow:0 1px 4px rgba(31,42,68,.12);font-weight:700}
    .manager-pane{display:none}.manager-pane.active{display:block}
    .editor-layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:650px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
    .record-sidebar{min-width:0;padding:16px;border-right:1px solid var(--line);background:#fafbfc}
    .record-list{min-width:0;display:grid;align-content:start;gap:4px;max-height:570px;margin-top:12px;overflow:auto}
    .record-item{width:100%;min-width:0;padding:10px;border:1px solid transparent;border-radius:6px;color:var(--muted);background:transparent;text-align:left;cursor:pointer}
    .record-item:hover,.record-item.active{border-color:#cdddf8;color:var(--ink);background:#eef4ff}
    .record-item strong,.record-item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .record-item strong{font-size:12px}.record-item small{margin-top:4px;color:var(--quiet);font-size:10px}
    .editor{min-width:0;padding:20px}.editor-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    .editor-header h2{margin:0;font-size:17px}.editor-actions{display:flex;align-items:center;gap:10px}
    .editor-meta,.editor-meta .field{min-width:0}.editor-meta{display:grid;grid-template-columns:1fr 1fr 150px;gap:12px;margin-bottom:14px}
    .editor textarea{min-height:470px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;tab-size:2}
    .editor textarea.json{min-height:535px}
    .editor-empty{min-height:610px;display:grid;place-items:center;color:var(--quiet);font-size:12px}
    .save-state{color:var(--muted);font-size:11px}.save-state.error{color:var(--error)}.save-state.success{color:#168443}
    .button.danger{color:#b42318;border-color:#f2c7c4;background:#fff}.button.danger:hover{color:#8f1d14;border-color:#e8aaa5;background:#fff5f4}
    .record-count{margin-top:7px;color:var(--quiet);font-size:10px}
    @media(max-width:800px){.editor-layout{grid-template-columns:1fr}.record-sidebar{border-right:0;border-bottom:1px solid var(--line)}.record-list{max-height:210px}.editor-meta{grid-template-columns:1fr}.editor-header{align-items:flex-start;flex-direction:column}.editor{padding:16px}.editor textarea,.editor textarea.json{min-height:420px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AI</span><span>本地数据管理</span></div>
    <nav class="top-actions"><a href="/web/index.html">返回工作台</a><a class="hide-mobile" href="/web/analytics.html">数据看板</a></nav>
  </header>
  <main class="page">
    <div class="title-row">
      <div><div class="eyebrow">Local Data</div><h1>文档与数据库</h1><p class="subtitle">Doc/AI策划案管线/文档库 · .ai-planner/runs</p></div>
      <div class="manager-tabs" role="tablist"><button class="manager-tab active" data-tab="documents">文档库</button><button class="manager-tab" data-tab="runs">运行数据库</button></div>
    </div>

    <section class="manager-pane active" id="documents-pane">
      <div class="editor-layout">
        <aside class="record-sidebar">
          <div class="field"><label for="document-query">搜索文档</label><input id="document-query" placeholder="标题或正文"></div>
          <div class="record-count" id="document-count"></div>
          <div class="record-list" id="document-list"></div>
        </aside>
        <div class="editor" id="document-editor"><div class="editor-empty">选择一份文档</div></div>
      </div>
    </section>

    <section class="manager-pane" id="runs-pane">
      <div class="editor-layout">
        <aside class="record-sidebar">
          <div class="field"><label for="run-query">搜索运行记录</label><input id="run-query" placeholder="ID、需求或标题"></div>
          <div class="record-count" id="run-count"></div>
          <div class="record-list" id="run-list"></div>
        </aside>
        <div class="editor" id="run-editor"><div class="editor-empty">选择一条运行记录</div></div>
      </div>
    </section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let documents=[];let runs=[];let selectedDocument=null;let selectedRun=null;let dirty=false;

    async function request(url,options={}){
      const response=await fetch(url,options);const data=await response.json();
      if(!response.ok)throw new Error(data.error||'请求失败');return data;
    }
    function mayDiscard(){return !dirty||confirm('当前修改尚未保存，确定放弃吗？')}
    function markDirty(){dirty=true;document.querySelectorAll('.save-state').forEach(node=>{node.textContent='有未保存修改';node.className='save-state'});}
    function setState(message,type=''){const node=document.querySelector('.manager-pane.active .save-state');if(node){node.textContent=message;node.className='save-state '+type}}
    function setActive(selector,id){document.querySelectorAll(selector).forEach(node=>node.classList.toggle('active',node.dataset.id===id));}

    function renderDocumentList(){
      const query=$('#document-query').value.trim().toLowerCase();
      const filtered=documents.filter(item=>!query||String(item.title+' '+item.activity_type+' '+item.path).toLowerCase().includes(query));
      $('#document-count').textContent=filtered.length+' 份文档';
      $('#document-list').innerHTML=filtered.length?filtered.map(item=>'<button class="record-item '+(selectedDocument?.id===item.id?'active':'')+'" data-id="'+esc(item.id)+'"><strong>'+esc(item.title)+'</strong><small>v'+esc(item.version)+' · '+esc(item.activity_type)+'</small></button>').join(''):'<div class="empty">没有匹配文档</div>';
      $('#document-list').querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>openDocument(button.dataset.id));
    }
    async function loadDocuments(){documents=await request('/api/documents');renderDocumentList();if(!selectedDocument&&documents.length)await openDocument(documents[0].id)}
    async function openDocument(id,version=null){
      if(!mayDiscard())return;
      const current=await request('/api/documents/'+encodeURIComponent(id)+(version?'?version='+version:''));
      if(!version||!selectedDocument||selectedDocument.id!==id)selectedDocument=await request('/api/documents/'+encodeURIComponent(id));
      dirty=false;setActive('#document-list [data-id]',id);
      const options=(selectedDocument.versions||[]).slice().reverse().map(item=>'<option value="'+item.version+'" '+(Number(current.requested_version)===Number(item.version)?'selected':'')+'>v'+item.version+' · '+esc(item.updated_at)+'</option>').join('');
      $('#document-editor').innerHTML='<div class="editor-header"><div><h2>'+esc(selectedDocument.title)+'</h2><div class="save-state">已加载 v'+esc(current.requested_version)+'</div></div><div class="editor-actions"><button class="button danger" id="delete-document">移到回收站</button><button class="primary" id="save-document">保存新版本</button></div></div><div class="editor-meta"><div class="field"><label for="document-title">标题</label><input id="document-title" value="'+esc(selectedDocument.title)+'"></div><div class="field"><label for="document-type">活动类型</label><input id="document-type" value="'+esc(selectedDocument.activity_type)+'"></div><div class="field"><label for="document-version">历史版本</label><select id="document-version">'+options+'</select></div></div><div class="field"><label for="document-content">Markdown 正文</label><textarea id="document-content">'+esc(current.content)+'</textarea></div>';
      ['#document-title','#document-type','#document-content'].forEach(selector=>$(selector).oninput=markDirty);
      $('#document-version').onchange=()=>openDocument(id,Number($('#document-version').value));
      $('#save-document').onclick=saveDocument;$('#delete-document').onclick=deleteDocument;
    }
    async function saveDocument(){
      const button=$('#save-document');button.disabled=true;setState('保存中');
      try{
        selectedDocument=await request('/api/documents/'+encodeURIComponent(selectedDocument.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('#document-title').value,activity_type:$('#document-type').value,content:$('#document-content').value,expected_version:selectedDocument.version})});
        dirty=false;await loadDocuments();await openDocument(selectedDocument.id);setState('已保存 v'+selectedDocument.version,'success');
      }catch(error){setState(error.message,'error')}finally{button.disabled=false}
    }
    async function deleteDocument(){
      if(!confirm('将文档“'+selectedDocument.title+'”及全部历史版本移到本地回收站？'))return;
      const id=selectedDocument.id;const version=selectedDocument.version;
      try{
        const result=await request('/api/documents/'+encodeURIComponent(id)+'?expected_version='+version,{method:'DELETE'});
        selectedDocument=null;dirty=false;$('#document-editor').innerHTML='<div class="editor-empty">文档已移到 '+esc(result.trash_path)+'</div>';await loadDocuments();setState('已移到回收站：'+result.trash_path,'success');
      }catch(error){setState(error.message,'error')}
    }

    function renderRunList(){
      const query=$('#run-query').value.trim().toLowerCase();
      const filtered=runs.filter(item=>!query||String(item.id+' '+item.request+' '+(item.document?.title||'')).toLowerCase().includes(query));
      $('#run-count').textContent=filtered.length+' 条记录';
      $('#run-list').innerHTML=filtered.length?filtered.map(item=>'<button class="record-item '+(selectedRun?.id===item.id?'active':'')+'" data-id="'+esc(item.id)+'"><strong>'+esc(item.document?.title||item.request)+'</strong><small>'+esc(item.stage)+' · '+esc(item.id)+'</small></button>').join(''):'<div class="empty">没有匹配记录</div>';
      $('#run-list').querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>openRun(button.dataset.id));
    }
    async function loadRuns(){runs=await request('/api/runs');renderRunList();if(!selectedRun&&runs.length)await openRun(runs[0].id)}
    async function openRun(id){
      if(!mayDiscard())return;
      selectedRun=await request('/api/runs/'+encodeURIComponent(id));dirty=false;setActive('#run-list [data-id]',id);
      $('#run-editor').innerHTML='<div class="editor-header"><div><h2>'+esc(selectedRun.id)+'</h2><div class="save-state">'+esc(selectedRun.updated_at)+'</div></div><div class="editor-actions"><button class="button danger" id="delete-run">移到回收站</button><button class="button" id="format-json">格式化</button><button class="primary" id="save-run">保存记录</button></div></div><div class="field"><label for="run-json">JSON 记录</label><textarea class="json" id="run-json" spellcheck="false">'+esc(JSON.stringify(selectedRun,null,2))+'</textarea></div>';
      $('#run-json').oninput=markDirty;$('#format-json').onclick=formatJson;$('#save-run').onclick=saveRun;$('#delete-run').onclick=deleteRun;
    }
    function formatJson(){try{$('#run-json').value=JSON.stringify(JSON.parse($('#run-json').value),null,2);markDirty();setState('JSON 格式正确','success')}catch(error){setState('JSON 格式错误：'+error.message,'error')}}
    async function saveRun(){
      let record;try{record=JSON.parse($('#run-json').value)}catch(error){setState('JSON 格式错误：'+error.message,'error');return}
      const button=$('#save-run');button.disabled=true;setState('保存中');
      try{
        const updated=await request('/api/runs/'+encodeURIComponent(selectedRun.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({record,expected_updated_at:selectedRun.updated_at})});
        selectedRun=updated;dirty=false;await loadRuns();await openRun(updated.id);setState('记录已保存','success');
      }catch(error){setState(error.message,'error')}finally{button.disabled=false}
    }
    async function deleteRun(){
      if(!confirm('将运行记录“'+selectedRun.id+'”移到本地回收站？'))return;
      const id=selectedRun.id;const updatedAt=selectedRun.updated_at;
      try{
        const result=await request('/api/runs/'+encodeURIComponent(id)+'?expected_updated_at='+encodeURIComponent(updatedAt),{method:'DELETE'});
        selectedRun=null;dirty=false;$('#run-editor').innerHTML='<div class="editor-empty">记录已移到 '+esc(result.trash_path)+'</div>';await loadRuns();setState('已移到回收站：'+result.trash_path,'success');
      }catch(error){setState(error.message,'error')}
    }

    document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{if(!mayDiscard())return;dirty=false;document.querySelectorAll('[data-tab]').forEach(item=>item.classList.toggle('active',item===button));document.querySelectorAll('.manager-pane').forEach(pane=>pane.classList.toggle('active',pane.id===button.dataset.tab+'-pane'))});
    $('#document-query').oninput=renderDocumentList;$('#run-query').oninput=renderRunList;
    Promise.all([loadDocuments(),loadRuns()]).catch(error=>{document.querySelector('.manager-pane.active .editor').innerHTML='<div class="editor-empty">'+esc(error.message)+'</div>'});
  </script>
</body>
</html>
