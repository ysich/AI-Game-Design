<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>策划案知识问答</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>策划案知识问答</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/knowledge.html">知识库管理</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Local Knowledge Assistant</div><h1>策划案知识库</h1><p class="subtitle">本地检索模板、项目约束和历史案例，并显示原始 Markdown 来源。</p></div></div><section class="panel"><div class="tabs"><button class="tab active" data-mode="knowledge">知识问答</button><button class="tab" data-mode="activity-type">活动类型反推</button><button class="tab" data-mode="rules-review">规则评审</button></div><div class="field"><label for="question">输入问题</label><textarea id="question" rows="3" placeholder="例如：签到活动的奖励设计需要注意什么？"></textarea></div><div style="margin-top:12px"><button class="primary" id="ask">查询知识库</button><span class="status" id="status"></span></div></section><section class="section panel"><h2 id="result-title">检索结果</h2><div id="results"><div class="empty">输入问题后查看本地知识条目。</div></div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let mode='knowledge';document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));$('#question').placeholder=mode==='activity-type'?'描述活动目标和用户状态，让知识库给出活动类型线索…':mode==='rules-review'?'粘贴规则或奖励方案，检索可能相关的约束…':'例如：签到活动的奖励设计需要注意什么？'});$('#ask').onclick=async()=>{const q=$('#question').value.trim();if(!q){$('#status').textContent='请输入问题';return}$('#status').textContent='检索中…';const items=await(await fetch('/api/knowledge?q='+encodeURIComponent(q))).json();$('#result-title').textContent=(mode==='activity-type'?'活动类型反推':mode==='rules-review'?'规则评审':'知识问答')+' · '+items.length+' 条参考';$('#results').innerHTML=items.length?items.map(item=>'<article class="context-card" style="padding:14px;margin:9px 0;border:1px solid var(--line);border-radius:11px"><div style="font-weight:700;font-size:13px">'+esc(item.title)+'</div><div style="margin-top:7px;color:var(--muted);font-size:11px;line-height:1.65;white-space:pre-wrap">'+esc(item.content)+'</div><div style="margin-top:8px;color:var(--quiet);font-size:10px">来源：'+esc(item.source)+'</div></article>').join(''):'<div class="empty">没有匹配结果，换一个关键词试试。</div>';$('#status').textContent='完成'};</script></body></html>
