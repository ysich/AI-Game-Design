<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner 反馈记录</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>Planner 反馈记录</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/analytics.html">数据看板</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Local Feedback</div><h1>反馈记录</h1><p class="subtitle">记录本地工作台的结果问题、规则建议和界面反馈。</p></div><button class="button" id="refresh">刷新</button></div><section class="panel"><form id="form" class="form-grid"><div class="field"><label for="type">反馈类型</label><select id="type"><option value="quality">策划案质量</option><option value="rule">规则检查</option><option value="ui">界面体验</option><option value="bug">问题报告</option><option value="general">其他</option></select></div><div class="field"><label for="run">关联运行记录（可选）</label><select id="run"><option value="">不关联</option></select></div><div class="field full"><label for="message">反馈内容</label><textarea id="message" required placeholder="描述实际结果、预期结果和可复现步骤…"></textarea></div><div class="field full"><button class="primary" type="submit">保存反馈</button><div class="status" id="status"></div></div></form></section><section class="section panel"><h2>已保存反馈</h2><div class="table-wrap"><table><thead><tr><th>时间</th><th>类型</th><th>内容</th><th>运行记录</th></tr></thead><tbody id="records"></tbody></table></div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const labels={quality:'策划案质量',rule:'规则检查',ui:'界面体验',bug:'问题报告',general:'其他'};async function load(){const [feedback,runs]=await Promise.all([fetch('/api/feedback').then(r=>r.json()),fetch('/api/runs').then(r=>r.json())]);$('#run').innerHTML='<option value="">不关联</option>'+runs.map(r=>'<option value="'+esc(r.id)+'">'+esc(r.id)+' · '+esc(r.document?.title||r.request)+'</option>').join('');$('#records').innerHTML=feedback.length?feedback.map(f=>'<tr><td>'+esc(f.created_at)+'</td><td><span class="badge">'+esc(labels[f.type]||f.type)+'</span></td><td>'+esc(f.message)+'</td><td>'+esc(f.run_id||'—')+'</td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无反馈</td></tr>'}$('#form').onsubmit=async e=>{e.preventDefault();const body={type:$('#type').value,run_id:$('#run').value,message:$('#message').value.trim()};const response=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();$('#status').textContent=response.ok?'反馈已保存':data.error||'保存失败';if(response.ok){$('#message').value='';await load()}};$('#refresh').onclick=load;load();</script></body></html>
