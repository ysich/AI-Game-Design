<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知识库管理</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>策划案知识库管理</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/design-document-knowledge.html">知识问答</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Local Knowledge</div><h1>知识库管理</h1><p class="subtitle">查看当前管线使用的模板、约束和历史案例。文件内容来自项目内 Markdown。</p></div><button class="button" id="refresh">刷新</button></div><section class="panel split"><div><div class="field"><label for="query">搜索知识条目</label><input id="query" placeholder="奖励、签到、社区任务…"></div><div class="list" id="items" style="margin-top:12px"></div></div><article id="content"><div class="empty">选择一条知识条目查看内容。</div></article></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let items=[];function render(){const q=$('#query').value.trim().toLowerCase();const filtered=items.filter(item=>!q||String(item.title+' '+item.content+' '+(item.tags||[]).join(' ')).toLowerCase().includes(q));$('#items').innerHTML=filtered.length?filtered.map((item,i)=>'<button data-index="'+i+'"><strong>'+esc(item.title)+'</strong><small>'+esc(item.source)+' · '+(item.tags||[]).slice(0,4).map(esc).join('、')+'</small></button>').join(''):'<div class="empty">没有匹配条目。</div>';document.querySelectorAll('[data-index]').forEach(btn=>btn.onclick=()=>show(filtered[Number(btn.dataset.index)]))}function show(item){$('#content').innerHTML='<div class="eyebrow">'+esc(item.source)+'</div><h2>'+esc(item.title)+'</h2><div class="markdown">'+esc(item.content)+'</div>'}async function load(){items=await(await fetch('/api/knowledge')).json();render()}$('#query').oninput=render;$('#refresh').onclick=load;load();</script></body></html>
