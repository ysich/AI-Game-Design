<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片生成工作台</title>
  <link rel="stylesheet" href="/web/portal.css" />
  <style>
    .run-picker{min-width:310px}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.image-task{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.image-preview{aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;color:var(--quiet);background:#f2f5fa;font-size:12px}.image-preview img{width:100%;height:100%;object-fit:contain;background:#eef1f6}.task-body{padding:15px}.task-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.task-title h2{margin:0;font-size:15px}.task-title .badge{flex:0 0 auto}.task-copy{margin:8px 0;color:var(--muted);font-size:11px;line-height:1.6}.components{margin:0 0 12px;color:var(--quiet);font-size:10px}.size-picker{display:grid;gap:6px;margin:0 0 10px}.size-picker label{color:var(--muted);font-size:11px;font-weight:700}.size-picker select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;outline:0;color:var(--ink);background:#fff;font:inherit;font-size:11px}.size-picker select:focus{border-color:#9abbff;box-shadow:0 0 0 3px rgba(55,125,255,.1)}.prompt{width:100%;min-height:92px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical;color:var(--ink);background:#fff;font:inherit;font-size:11px;line-height:1.6;outline:0}.prompt:focus{border-color:#9abbff;box-shadow:0 0 0 3px rgba(55,125,255,.1)}.task-actions{display:flex;align-items:center;gap:9px;margin-top:10px}.task-status{color:var(--muted);font-size:10px}.image-meta{margin-top:8px;color:var(--quiet);font-size:10px}.config-state{display:flex;align-items:center;gap:8px}.config-state .badge{white-space:nowrap}@media(max-width:800px){.task-grid{grid-template-columns:1fr}.run-picker{min-width:0;width:100%}.title-row .field{margin-top:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AI</span><span>图片生成工作台</span></div>
    <nav class="top-actions"><a href="/web/model-settings.html">模型设置</a><a href="/web/index.html">返回工作台</a></nav>
  </header>
  <main class="page">
    <div class="title-row">
      <div><div class="eyebrow">Visual Generation Studio</div><h1>从界面任务生成图片</h1><p class="subtitle">检查自动生成的提示词，按页面任务分别生成并保留结果。</p><div class="config-state"><span class="badge" id="model-state">图片模型：读取中</span><span class="status" id="global-status"></span></div></div>
      <div class="field run-picker"><label for="run-select">策划案</label><select id="run-select"></select></div>
    </div>
    <div class="hint" id="provider-hint">正在读取图片模型配置…</div>
    <section class="section"><div id="tasks"><div class="empty">正在读取界面任务…</div></div></section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const imageSizeGroups=[{label:'方形屏幕 · 1:1',options:[{value:'1024x1024',label:'1024 × 1024'}]},{label:'横屏 · 3:2',options:[{value:'1536x1024',label:'1536 × 1024'}]},{label:'竖屏 · 2:3',options:[{value:'1024x1536',label:'1024 × 1536'}]},{label:'模型自适应',options:[{value:'auto',label:'自动'}]}];let runs=[];let currentRun=null;let imageConfig=null;
    function imageSizeOptions(selected){return imageSizeGroups.map(group=>'<optgroup label="'+esc(group.label)+'">'+group.options.map(option=>'<option value="'+option.value+'" '+(option.value===selected?'selected':'')+'>'+esc(option.label)+'</option>').join('')+'</optgroup>').join('');}
    function imageSizeLabel(size){for(const group of imageSizeGroups){const option=group.options.find(item=>item.value===size);if(option)return group.label+' · '+option.label;}return size||'未记录';}
    function defaultPrompt(run,task){const title=run.document?.title||run.request;return '为游戏活动《'+title+'》设计'+task.screen_name+'的高保真 UI 效果图。用途：'+task.purpose+'。布局：'+task.layout+'。组件：'+(task.components||[]).join('、')+'。界面文案：'+(task.copy||[]).join('、')+'。状态：'+task.state+'。画面清晰，信息层级明确，适合游戏内实际落地。';}
    function latestImage(run,taskId){return[...(run.generated_images||[])].reverse().find(image=>image.task_id===taskId);}
    function render(){if(!currentRun?.visual_tasks?.length){$('#tasks').innerHTML='<div class="empty">该策划案没有界面任务。</div>';return;}const enabled=imageConfig?.provider==='openai_compatible';$('#tasks').innerHTML='<div class="task-grid">'+currentRun.visual_tasks.map((task,index)=>{const result=latestImage(currentRun,task.id);const selectedSize=result?.size||imageConfig?.size||'1024x1024';return '<article class="image-task"><div class="image-preview" id="preview-'+index+'">'+(result?'<img src="'+esc(result.url)+'" alt="'+esc(task.screen_name)+'" />':'尚未生成')+'</div><div class="task-body"><div class="task-title"><h2>'+esc(task.screen_name)+'</h2><span class="badge '+(result?'success':'')+'">'+(result?'已生成':'待生成')+'</span></div><p class="task-copy">'+esc(task.purpose)+' · '+esc(task.layout)+'</p><p class="components">组件：'+(task.components||[]).map(esc).join('、')+'</p><div class="size-picker"><label for="size-'+index+'">屏幕比例与分辨率</label><select id="size-'+index+'">'+imageSizeOptions(selectedSize)+'</select></div><textarea class="prompt" id="prompt-'+index+'" aria-label="'+esc(task.screen_name)+'提示词">'+esc(result?.prompt||defaultPrompt(currentRun,task))+'</textarea><div class="task-actions"><button class="primary" data-generate="'+index+'" '+(enabled?'':'disabled')+'>生成图片</button><span class="task-status" id="status-'+index+'">'+(enabled?'': '请先启用图片模型')+'</span></div>'+(result?'<div class="image-meta">模型：'+esc(result.model)+' · '+esc(imageSizeLabel(result.size||selectedSize))+(result.revised_prompt?' · 模型已优化提示词':'')+'</div>':'')+'</div></article>';}).join('')+'</div>';document.querySelectorAll('[data-generate]').forEach(button=>button.onclick=()=>generate(Number(button.dataset.generate),button));}
    async function generate(index,button){const task=currentRun.visual_tasks[index];const size=$('#size-'+index).value;button.disabled=true;button.textContent='生成中…';$('#status-'+index).textContent='图片模型正在处理';try{const response=await fetch('/api/images/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:currentRun.id,task_id:task.id,prompt:$('#prompt-'+index).value,size})});const data=await response.json();if(!response.ok)throw new Error(data.error||'图片生成失败');currentRun.generated_images=currentRun.generated_images||[];currentRun.generated_images.push(data);task.status='generated';render();$('#global-status').textContent='已生成 '+task.screen_name+' · '+imageSizeLabel(size);}catch(error){$('#status-'+index).textContent=error.message;button.disabled=false;button.textContent='重新生成';}}
    async function load(){const [configResponse,runsResponse]=await Promise.all([fetch('/api/config'),fetch('/api/runs')]);const config=await configResponse.json();runs=await runsResponse.json();if(!configResponse.ok)throw new Error(config.error||'配置读取失败');imageConfig=config.image;const enabled=imageConfig.provider==='openai_compatible';$('#model-state').textContent='图片模型：'+(enabled?imageConfig.model:'未启用');$('#model-state').classList.toggle('success',enabled);$('#provider-hint').innerHTML=enabled?'当前通过 <strong>'+esc(imageConfig.model)+'</strong> 生成图片。每个界面任务都可以选择屏幕比例与分辨率，默认使用 '+esc(imageSizeLabel(imageConfig.size))+'，质量 '+esc(imageConfig.quality)+'。':'尚未启用图片模型。请先前往 <a href="/web/model-settings.html">模型设置</a> 配置 OpenAI 兼容 Images API。';const available=runs.filter(run=>run.visual_tasks?.length);$('#run-select').innerHTML=available.length?available.map(run=>'<option value="'+esc(run.id)+'">'+esc(run.document?.title||run.request)+'</option>').join(''):'<option value="">暂无界面任务</option>';currentRun=available[0]||null;render();}
    $('#run-select').onchange=()=>{currentRun=runs.find(run=>run.id===$('#run-select').value)||null;render();};
    load().catch(error=>{$('#global-status').textContent=error.message;$('#tasks').innerHTML='<div class="empty">'+esc(error.message)+'</div>';});
  </script>
</body>
</html>
