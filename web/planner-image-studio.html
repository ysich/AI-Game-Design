<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片生成工作台</title>
  <link rel="stylesheet" href="/web/portal.css" />
  <style>
    .run-picker{min-width:310px}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.image-task{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.image-preview{min-height:220px;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;color:var(--quiet);background:#f2f5fa;font-size:12px}.image-preview-button{width:100%;border:0;color:inherit;background:#f2f5fa;font:inherit;cursor:zoom-in}.image-preview-button:focus-visible{outline:3px solid rgba(55,125,255,.45);outline-offset:-3px}.image-preview img{display:block;width:auto;height:auto;max-width:100%;max-height:380px;object-fit:contain;background:#eef1f6;transition:transform .18s ease}.image-preview-button:hover img{transform:scale(1.015)}.task-body{padding:15px}.task-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.task-title h2{margin:0;font-size:15px}.task-title .badge{flex:0 0 auto}.task-copy{margin:8px 0;color:var(--muted);font-size:11px;line-height:1.6}.components{margin:0 0 12px;color:var(--quiet);font-size:10px}.prompt{width:100%;min-height:92px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical;color:var(--ink);background:#fff;font:inherit;font-size:11px;line-height:1.6;outline:0}.prompt:focus{border-color:#9abbff;box-shadow:0 0 0 3px rgba(55,125,255,.1)}.task-actions{display:flex;align-items:center;gap:9px;margin-top:10px}.task-status{color:var(--muted);font-size:10px}.image-meta{margin-top:8px;color:var(--quiet);font-size:10px}.config-state{display:flex;align-items:center;gap:8px}.config-state .badge{white-space:nowrap}.lightbox-open{overflow:hidden}.image-lightbox{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:28px;background:rgba(15,23,42,.84)}.image-lightbox[hidden]{display:none}.image-lightbox img{display:block;width:auto;height:auto;max-width:calc(100vw - 56px);max-height:calc(100vh - 56px);object-fit:contain;box-shadow:0 18px 60px rgba(0,0,0,.35)}.image-lightbox-close{position:absolute;top:16px;right:18px;width:40px;height:40px;border:1px solid rgba(255,255,255,.45);border-radius:50%;color:#fff;background:rgba(15,23,42,.6);font-size:24px;line-height:1;cursor:pointer}.image-lightbox-close:hover{background:rgba(15,23,42,.9)}@media(max-width:800px){.task-grid{grid-template-columns:1fr}.run-picker{min-width:0;width:100%}.title-row .field{margin-top:14px}.image-preview{min-height:180px}.image-preview img{max-height:320px}.image-lightbox{padding:16px}.image-lightbox img{max-width:calc(100vw - 32px);max-height:calc(100vh - 32px)}}
  </style>
  <style>
    .prompt-label{display:block;margin:12px 0 6px;color:var(--muted);font-size:11px;font-weight:700}.supplement-prompt{min-height:68px}.global-reference{display:grid;grid-template-columns:minmax(260px,.9fr) minmax(320px,1.1fr);gap:14px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fff}.global-reference[hidden]{display:none}.global-reference-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px}.global-reference-heading h2{margin:0;font-size:14px}.global-reference-heading small{color:var(--quiet);font-size:10px}.global-reference-controls{display:flex;align-items:stretch;gap:8px}.reference-library-list{min-height:42px;max-height:148px;min-width:0;flex:1;overflow:auto;padding:5px;border:1px solid var(--line);border-radius:8px;background:#f8faff}.reference-library-empty{padding:8px;color:var(--quiet);font-size:10px}.reference-option{display:grid;grid-template-columns:18px 34px minmax(0,1fr);align-items:center;gap:7px;padding:5px;border-radius:6px;color:var(--muted);font-size:10px;cursor:pointer}.reference-option:hover{background:var(--accent-soft)}.reference-option input{margin:0}.reference-option img{width:34px;height:34px;object-fit:cover;border-radius:5px;background:#eef1f6}.reference-option span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reference-upload{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}.reference-upload:hover{border-color:#bfd4ff;color:var(--accent);background:var(--accent-soft)}.reference-upload input{display:none}.reference-preview{min-height:72px;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--quiet);background:#f8faff;font-size:10px}.reference-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}.reference-selected{min-width:0;padding:0;border:0;color:var(--muted);background:transparent;font:inherit;text-align:left;cursor:zoom-in}.reference-selected img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;background:#eef1f6}.reference-selected span{display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reference-preview-copy{min-width:0;padding:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reference-preview-copy small{display:block;margin-top:4px;color:var(--quiet);overflow:hidden;text-overflow:ellipsis}.reference-status{min-height:16px;margin-top:6px;color:var(--muted);font-size:10px}@media(max-width:800px){.global-reference{grid-template-columns:1fr}.global-reference-controls{flex-direction:column}.reference-upload{width:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AI</span><span>图片生成工作台</span></div>
    <nav class="top-actions"><a href="/web/model-settings.html">模型设置</a><a href="/web/index.html">返回工作台</a></nav>
  </header>
  <main class="page">
    <div class="title-row">
      <div><div class="eyebrow">Visual Generation Studio</div><h1>从界面任务生成图片</h1><p class="subtitle">检查自动生成的提示词，按页面任务分别生成并保留结果。</p><div class="config-state"><span class="badge" id="model-state">图片模型：读取中</span><span class="status" id="global-status"></span></div></div>
      <div class="field run-picker"><label for="run-select">策划案</label><select id="run-select"></select></div>
    </div>
    <div class="hint" id="provider-hint">正在读取图片模型配置…</div>
    <section class="global-reference" id="global-reference" hidden>
      <div>
        <div class="global-reference-heading"><h2>策划案总参考图</h2><small id="global-reference-count">0 / 16</small></div>
        <div class="global-reference-controls">
          <div class="reference-library-list" id="global-reference-options" role="group" aria-label="从资料库选择总参考图"></div>
          <label class="reference-upload" for="global-reference-upload">上传参考图<input id="global-reference-upload" type="file" multiple accept="image/png,image/jpeg,image/webp" /></label>
        </div>
        <div class="reference-status" id="global-reference-status"></div>
      </div>
      <div class="reference-preview" id="global-reference-preview"></div>
    </section>
    <section class="section"><div id="tasks"><div class="empty">正在读取界面任务…</div></div></section>
  </main>
  <div class="image-lightbox" id="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="图片大图预览">
    <button type="button" class="image-lightbox-close" id="image-lightbox-close" aria-label="关闭大图预览" title="关闭">&times;</button>
    <img id="image-lightbox-image" alt="" />
  </div>
  <script>
    const $=selector=>document.querySelector(selector);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const imageRatios={'1792x768':'21:9','1536x864':'16:9','1536x1024':'3:2','1365x1024':'4:3','1024x1024':'1:1','1024x1365':'3:4','1024x1536':'2:3','864x1536':'9:16','768x1792':'9:21'};
    const acceptedReferenceTypes=['image/png','image/jpeg','image/webp'];
    let runs=[];
    let currentRun=null;
    let imageConfig=null;
    let referenceLibraryImages=[];
    let lastFocusedElement=null;
    const promptSupplements=new Map();

    function imageSizeLabel(size){if(size==='auto')return '自动';return imageRatios[size]?imageRatios[size]+' · '+size:(size||'未记录');}
    function defaultPrompt(run,task){const title=run.document?.title||run.request;return '为游戏活动《'+title+'》设计'+task.screen_name+'的高保真 UI 效果图。用途：'+task.purpose+'。布局：'+task.layout+'。组件：'+(task.components||[]).join('、')+'。界面文案：'+(task.copy||[]).join('、')+'。状态：'+task.state+'。画面清晰，信息层级明确，适合游戏内实际落地。';}
    function latestImage(run,taskId){return[...(run.generated_images||[])].reverse().find(image=>image.task_id===taskId);}
    function openLightbox(imageUrl,alt){lastFocusedElement=document.activeElement;$('#image-lightbox-image').src=imageUrl;$('#image-lightbox-image').alt=alt;$('#image-lightbox').hidden=false;document.body.classList.add('lightbox-open');$('#image-lightbox-close').focus();}
    function closeLightbox(){const lightbox=$('#image-lightbox');if(lightbox.hidden)return;lightbox.hidden=true;$('#image-lightbox-image').removeAttribute('src');document.body.classList.remove('lightbox-open');lastFocusedElement?.focus();lastFocusedElement=null;}
    function bindPreviewEvents(){document.querySelectorAll('[data-preview-image]').forEach(button=>button.onclick=()=>openLightbox(button.dataset.previewImage,button.dataset.previewAlt));}
    function taskStateKey(task){return currentRun.id+'::'+task.id;}
    function effectiveReferenceIds(run){
      if(!run)return [];
      if(run.image_reference_ids!==undefined&&run.image_reference_ids!==null)return run.image_reference_ids;
      if(run.image_reference_id!==undefined&&run.image_reference_id!==null)return run.image_reference_id?[run.image_reference_id]:[];
      return (run.reference_ids||[]).filter(id=>referenceLibraryImages.some(item=>item.id===id)).slice(0,16);
    }
    function currentReferences(){const ids=new Set(effectiveReferenceIds(currentRun));return referenceLibraryImages.filter(item=>ids.has(item.id));}
    function setReferenceControlsDisabled(disabled){document.querySelectorAll('[data-reference-id]').forEach(input=>input.disabled=disabled);$('#global-reference-upload').disabled=disabled;}
    function renderGlobalReference(){
      const panel=$('#global-reference');
      panel.hidden=!currentRun;
      if(!currentRun)return;
      const selectedIds=effectiveReferenceIds(currentRun);
      const selectedIdSet=new Set(selectedIds);
      $('#global-reference-count').textContent=selectedIds.length+' / 16';
      $('#global-reference-options').innerHTML=referenceLibraryImages.length?referenceLibraryImages.map(item=>'<label class="reference-option"><input type="checkbox" data-reference-id="'+esc(item.id)+'" '+(selectedIdSet.has(item.id)?'checked':'')+' /><img src="'+esc(item.url)+'" alt="" /><span title="'+esc(item.filename)+'">'+esc(item.filename)+'</span></label>').join(''):'<div class="reference-library-empty">资料库暂无图片</div>';
      const selected=currentReferences();
      const missingCount=selectedIds.length-selected.length;
      if(selected.length){
        $('#global-reference-preview').innerHTML='<div class="reference-preview-grid">'+selected.map(item=>'<button type="button" class="reference-selected" data-preview-image="'+esc(item.url)+'" data-preview-alt="'+esc(item.filename)+'" aria-label="查看 '+esc(item.filename)+' 大图" title="查看大图"><img src="'+esc(item.url)+'" alt="'+esc(item.filename)+'" /><span title="'+esc(item.filename)+'">'+esc(item.filename)+'</span></button>').join('')+'</div>'+(missingCount?'<div class="reference-preview-copy">另有 '+missingCount+' 张图片不可用</div>':'');
      }else if(selectedIds.length){
        $('#global-reference-preview').innerHTML='<div class="reference-preview-copy">原总参考图不可用<small>请从资料库重新选择</small></div>';
      }else{
        $('#global-reference-preview').innerHTML='<div class="reference-preview-copy">未选择总参考图<small>可选择或上传多张 PNG、JPEG、WebP</small></div>';
      }
      document.querySelectorAll('[data-reference-id]').forEach(input=>input.onchange=()=>saveGlobalReferences([...document.querySelectorAll('[data-reference-id]:checked')].map(item=>item.dataset.referenceId)));
      bindPreviewEvents();
    }
    async function saveGlobalReferences(referenceIds){
      if(!currentRun)return;
      referenceIds=[...new Set(referenceIds)];
      if(referenceIds.length>16){$('#global-reference-status').textContent='总参考图最多选择 16 张';renderGlobalReference();return;}
      setReferenceControlsDisabled(true);
      $('#global-reference-status').textContent='正在保存…';
      try{
        const response=await fetch('/api/runs/'+encodeURIComponent(currentRun.id)+'/image-references',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference_ids:referenceIds})});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'总参考图保存失败');
        const index=runs.findIndex(run=>run.id===data.id);
        if(index>=0)runs[index]=data;
        currentRun=data;
        renderGlobalReference();
        $('#global-reference-status').textContent=referenceIds.length?'已应用 '+referenceIds.length+' 张总参考图':'已停用总参考图';
      }catch(error){
        $('#global-reference-status').textContent=error.message;
        renderGlobalReference();
      }finally{
        setReferenceControlsDisabled(false);
      }
    }
    async function uploadGlobalReference(event){
      const input=event.target;
      const files=Array.from(input.files||[]);
      if(!files.length)return;
      if(effectiveReferenceIds(currentRun).length+files.length>16){$('#global-reference-status').textContent='总参考图最多选择 16 张';input.value='';return;}
      if(files.some(file=>!acceptedReferenceTypes.includes(file.type))){$('#global-reference-status').textContent='仅支持 PNG、JPEG 或 WebP';input.value='';return;}
      if(files.some(file=>file.size<1||file.size>10*1024*1024)){$('#global-reference-status').textContent='每张图片必须在 1 B 到 10 MB 之间';input.value='';return;}
      const formData=new FormData();
      files.forEach(file=>formData.append('files',file));
      input.disabled=true;
      $('#global-reference-status').textContent='正在上传到参考资料库…';
      try{
        const response=await fetch('/api/references/upload',{method:'POST',body:formData});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'参考图上传失败');
        const uploaded=(data.items||[]).filter(item=>item.kind==='image'&&acceptedReferenceTypes.includes(item.mime_type));
        if(!uploaded.length)throw new Error('上传结果中没有可用图片');
        const uploadedIds=new Set(uploaded.map(item=>item.id));
        referenceLibraryImages=[...uploaded,...referenceLibraryImages.filter(item=>!uploadedIds.has(item.id))];
        await saveGlobalReferences([...effectiveReferenceIds(currentRun),...uploadedIds]);
      }catch(error){
        $('#global-reference-status').textContent=error.message;
      }finally{
        input.disabled=false;
        input.value='';
      }
    }
    function bindTaskInputs(){document.querySelectorAll('[data-supplement]').forEach(textarea=>textarea.oninput=()=>promptSupplements.set(taskStateKey(currentRun.visual_tasks[Number(textarea.dataset.supplement)]),textarea.value));}
    function render(){
      if(!currentRun?.visual_tasks?.length){$('#tasks').innerHTML='<div class="empty">该策划案没有界面任务。</div>';return;}
      const enabled=imageConfig?.provider==='openai_compatible';
      $('#tasks').innerHTML='<div class="task-grid">'+currentRun.visual_tasks.map((task,index)=>{
        const result=latestImage(currentRun,task.id);
        const preview=result?'<button type="button" class="image-preview image-preview-button" data-preview-image="'+esc(result.url)+'" data-preview-alt="'+esc(task.screen_name)+'" aria-label="查看'+esc(task.screen_name)+'大图" title="查看大图"><img src="'+esc(result.url)+'" alt="'+esc(task.screen_name)+'" /></button>':'<div class="image-preview" id="preview-'+index+'">尚未生成</div>';
        const key=taskStateKey(task);
        const supplement=promptSupplements.has(key)?promptSupplements.get(key):result?.supplement_prompt||'';
        const referenceCount=result?.reference_images?.length||(result?.reference_image_url?1:0);
        return '<article class="image-task">'+preview+'<div class="task-body"><div class="task-title"><h2>'+esc(task.screen_name)+'</h2><span class="badge '+(result?'success':'')+'">'+(result?'已生成':'待生成')+'</span></div><p class="task-copy">'+esc(task.purpose)+' · '+esc(task.layout)+'</p><p class="components">组件：'+(task.components||[]).map(esc).join('、')+'</p><label class="prompt-label" for="prompt-'+index+'">基础提示词</label><textarea class="prompt" id="prompt-'+index+'" aria-label="'+esc(task.screen_name)+'基础提示词">'+esc(result?.base_prompt||result?.prompt||defaultPrompt(currentRun,task))+'</textarea><label class="prompt-label" for="supplement-'+index+'">补充提示词（可选）</label><textarea class="prompt supplement-prompt" id="supplement-'+index+'" data-supplement="'+index+'" placeholder="补充风格、构图、材质或需要避开的元素">'+esc(supplement)+'</textarea><div class="task-actions"><button class="primary" data-generate="'+index+'" '+(enabled?'':'disabled')+'>生成图片</button><span class="task-status" id="status-'+index+'">'+(enabled?'':'请先启用图片模型')+'</span></div>'+(result?'<div class="image-meta">模型：'+esc(result.model)+' · '+esc(imageSizeLabel(result.size||imageConfig?.size))+(result.revised_prompt?' · 模型已优化提示词':'')+(referenceCount?' · 已使用 '+referenceCount+' 张总参考图':'')+'</div>':'')+'</div></article>';
      }).join('')+'</div>';
      bindPreviewEvents();
      bindTaskInputs();
      document.querySelectorAll('[data-generate]').forEach(button=>button.onclick=()=>generate(Number(button.dataset.generate),button));
    }
    async function generate(index,button){
      const task=currentRun.visual_tasks[index];
      const key=taskStateKey(task);
      const supplement=$('#supplement-'+index).value.trim();
      promptSupplements.set(key,supplement);
      button.disabled=true;
      button.textContent='生成中…';
      const referenceCount=currentReferences().length;
      $('#status-'+index).textContent=referenceCount?'图片模型正在处理 '+referenceCount+' 张总参考图':'图片模型正在处理';
      const body={run_id:currentRun.id,task_id:task.id,prompt:$('#prompt-'+index).value,supplement_prompt:supplement};
      try{
        const response=await fetch('/api/images/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||'图片生成失败');
        currentRun.generated_images=currentRun.generated_images||[];
        currentRun.generated_images.push(data);
        task.status='generated';
        render();
        $('#global-status').textContent='已生成 '+task.screen_name+' · '+imageSizeLabel(data.size||imageConfig?.size);
      }catch(error){
        $('#status-'+index).textContent=error.message;
        button.disabled=false;
        button.textContent='重新生成';
      }
    }
    async function load(){
      const [configResponse,runsResponse,referencesResponse]=await Promise.all([fetch('/api/config'),fetch('/api/runs'),fetch('/api/references/uploaded')]);
      const [config,runsPayload,referencesPayload]=await Promise.all([configResponse.json(),runsResponse.json(),referencesResponse.json()]);
      if(!configResponse.ok)throw new Error(config.error||'配置读取失败');
      if(!runsResponse.ok)throw new Error(runsPayload.error||'运行记录读取失败');
      if(!referencesResponse.ok)throw new Error(referencesPayload.error||'参考资料读取失败');
      if(!Array.isArray(runsPayload))throw new Error('运行记录响应格式无效');
      if(!Array.isArray(referencesPayload))throw new Error('参考资料响应格式无效');
      runs=runsPayload;
      referenceLibraryImages=referencesPayload.filter(item=>item.kind==='image'&&acceptedReferenceTypes.includes(item.mime_type));
      imageConfig=config.image;
      const enabled=imageConfig.provider==='openai_compatible';
      $('#model-state').textContent='图片模型：'+(enabled?imageConfig.model:'未启用');
      $('#model-state').classList.toggle('success',enabled);
      $('#provider-hint').innerHTML=enabled?'当前通过 <strong>'+esc(imageConfig.model)+'</strong> 生成图片，统一使用模型设置中的 '+esc(imageSizeLabel(imageConfig.size))+'，质量 '+esc(imageConfig.quality)+'。':'尚未启用图片模型。请先前往 <a href="/web/model-settings.html">模型设置</a> 配置 OpenAI 兼容 Images API。';
      const available=runs.filter(run=>run.visual_tasks?.length);
      $('#run-select').innerHTML=available.length?available.map(run=>'<option value="'+esc(run.id)+'">'+esc(run.document?.title||run.request)+'</option>').join(''):'<option value="">暂无界面任务</option>';
      currentRun=available[0]||null;
      renderGlobalReference();
      render();
    }
    $('#run-select').onchange=()=>{currentRun=runs.find(run=>run.id===$('#run-select').value)||null;renderGlobalReference();render();};
    $('#global-reference-upload').onchange=uploadGlobalReference;
    $('#image-lightbox-close').onclick=closeLightbox;
    $('#image-lightbox').onclick=event=>{if(event.target.id==='image-lightbox')closeLightbox();};
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeLightbox();});
    load().catch(error=>{$('#global-status').textContent=error.message;$('#tasks').innerHTML='<div class="empty">'+esc(error.message)+'</div>';});
  </script>
</body>
</html>
