<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner 图片与界面任务</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>Planner 图片与界面任务</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/coding.html">Coding 案</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Visual Task Studio</div><h1>图片与界面任务</h1><p class="subtitle">查看管线拆分出的页面、状态和组件。真实生图需要后续接入 ImageProvider。</p></div></div><div class="hint">当前版本已实现视觉任务拆分与状态查看；没有外部图片模型时不会伪造生成结果。</div><section class="section panel"><h2>最近一次策划案的界面任务</h2><div id="tasks"><div class="empty">正在读取…</div></div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){const runs=await(await fetch('/api/runs')).json();const run=runs.find(item=>item.visual_tasks?.length);if(!run){$('#tasks').innerHTML='<div class="empty">暂无界面任务。先在工作台生成一份策划案。</div>';return}$('#tasks').innerHTML='<div class="grid">'+run.visual_tasks.map((task,i)=>'<article class="metric"><div class="metric-label">页面 '+(i+1)+'</div><div class="metric-value" style="font-size:17px">'+esc(task.screen_name)+'</div><div class="metric-note">状态：'+esc(task.state)+'</div><p class="subtitle" style="margin-top:10px">'+esc(task.purpose)+'</p><p class="metric-note" style="margin-top:8px">组件：'+(task.components||[]).map(esc).join('、')+'</p></article>').join('')+'</div>'}load();</script></body></html>
