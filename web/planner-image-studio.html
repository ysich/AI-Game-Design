<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片生成工作台</title>
  <link rel="stylesheet" href="/web/portal.css" />
  <style>
    .run-picker{min-width:310px}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.image-task{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}.image-preview{aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;color:var(--quiet);background:#f2f5fa;font-size:12px}.image-preview img{width:100%;height:100%;object-fit:contain;background:#eef1f6}.task-body{padding:15px}.task-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.task-title h2{margin:0;font-size:15px}.task-title .badge{flex:0 0 auto}.task-copy{margin:8px 0;color:var(--muted);font-size:11px;line-height:1.6}.components{margin:0 0 12px;color:var(--quiet);font-size:10px}.ratio-picker{margin:0 -2px 14px;padding:14px 12px 11px;border:1px solid #e1e6f0;border-radius:14px;background:#fbfcff}.ratio-picker-title{margin:0 0 11px;color:#5b6a83;font-size:13px;font-weight:700}.ratio-options{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 3px;scrollbar-width:thin}.ratio-option{display:flex;flex:0 0 48px;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:62px;padding:6px 3px;border:0;border-radius:11px;color:#697891;background:#f4f6fa;cursor:pointer;font:700 10px/1 inherit;transition:background .16s ease,color .16s ease,box-shadow .16s ease}.ratio-option:hover{color:#4e62d8;background:#e9edff}.ratio-option.active{color:#fff;background:#6374f0;box-shadow:0 6px 13px rgba(99,116,240,.24)}.ratio-shape{display:block;width:18px;height:18px;border:1.4px solid currentColor;border-radius:3px}.ratio-option[data-ratio="21:9"] .ratio-shape{width:27px;height:10px}.ratio-option[data-ratio="16:9"] .ratio-shape{width:25px;height:14px}.ratio-option[data-ratio="3:2"] .ratio-shape{width:23px;height:16px}.ratio-option[data-ratio="4:3"] .ratio-shape{width:21px;height:16px}.ratio-option[data-ratio="1:1"] .ratio-shape{width:18px;height:18px}.ratio-option[data-ratio="3:4"] .ratio-shape{width:16px;height:21px}.ratio-option[data-ratio="2:3"] .ratio-shape{width:14px;height:21px}.ratio-option[data-ratio="9:16"] .ratio-shape{width:11px;height:23px}.ratio-option[data-ratio="9:21"] .ratio-shape{width:9px;height:25px}.prompt{width:100%;min-height:92px;padding:10px 11px;border:1px solid var(--line);border-radius:8px;resize:vertical;color:var(--ink);background:#fff;font:inherit;font-size:11px;line-height:1.6;outline:0}.prompt:focus{border-color:#9abbff;box-shadow:0 0 0 3px rgba(55,125,255,.1)}.task-actions{display:flex;align-items:center;gap:9px;margin-top:10px}.task-status{color:var(--muted);font-size:10px}.image-meta{margin-top:8px;color:var(--quiet);font-size:10px}.config-state{display:flex;align-items:center;gap:8px}.config-state .badge{white-space:nowrap}@media(max-width:800px){.task-grid{grid-template-columns:1fr}.run-picker{min-width:0;width:100%}.title-row .field{margin-top:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">AI</span><span>图片生成工作台</span></div>
    <nav class="top-actions"><a href="/web/model-settings.html">模型设置</a><a href="/web/index.html">返回工作台</a></nav>
  </header>
  <main class="page">
    <div class="title-row">
      <div><div class="eyebrow">Visual Generation Studio</div><h1>从界面任务生成图片</h1><p class="subtitle">检查自动生成的提示词，按页面任务分别生成并保留结果。</p><div class="config-state"><span class="badge" id="model-state">图片模型：读取中</span><span class="status" id="global-status"></span></div></div>
      <div class="field run-picker"><label for="run-select">策划案</label><select id="run-select"></select></div>
    </div>
    <div class="hint" id="provider-hint">正在读取图片模型配置…</div>
    <section class="section"><div id="tasks"><div class="empty">正在读取界面任务…</div></div></section>
  </main>
  <script>
    const $=selector=>document.querySelector(selector);const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));const imageRatioOptions=[{ratio:'21:9',size:'1792x768'},{ratio:'16:9',size:'1536x864'},{ratio:'3:2',size:'1536x1024'},{ratio:'4:3',size:'1365x1024'},{ratio:'1:1',size:'1024x1024'},{ratio:'3:4',size:'1024x1365'},{ratio:'2:3',size:'1024x1536'},{ratio:'9:16',size:'864x1536'},{ratio:'9:21',size:'768x1792'}];let runs=[];let currentRun=null;let imageConfig=null;
    function ratioForSize(size){return imageRatioOptions.find(option=>option.size===size)||imageRatioOptions.find(option=>option.ratio==='1:1');}
    function ratioOptionsMarkup(selectedRatio,index){return imageRatioOptions.map(option=>'<button type="button" class="ratio-option '+(option.ratio===selectedRatio?'active':'')+'" data-ratio-button="'+index+'" data-ratio="'+option.ratio+'" data-size="'+option.size+'" aria-pressed="'+(option.ratio===selectedRatio?'true':'false')+'"><span class="ratio-shape" aria-hidden="true"></span><span>'+option.ratio+'</span></button>').join('');}
    function imageSizeLabel(size){if(size==='auto')return '自动';const option=ratioForSize(size);return option?option.ratio+' · '+option.size:(size||'未记录');}
    function defaultPrompt(run,task){const title=run.document?.title||run.request;return '为游戏活动《'+title+'》设计'+task.screen_name+'的高保真 UI 效果图。用途：'+task.purpose+'。布局：'+task.layout+'。组件：'+(task.components||[]).join('、')+'。界面文案：'+(task.copy||[]).join('、')+'。状态：'+task.state+'。画面清晰，信息层级明确，适合游戏内实际落地。';}
    function latestImage(run,taskId){return[...(run.generated_images||[])].reverse().find(image=>image.task_id===taskId);}
    function render(){if(!currentRun?.visual_tasks?.length){$('#tasks').innerHTML='<div class="empty">该策划案没有界面任务。</div>';return;}const enabled=imageConfig?.provider==='openai_compatible';$('#tasks').innerHTML='<div class="task-grid">'+currentRun.visual_tasks.map((task,index)=>{const result=latestImage(currentRun,task.id);const selected=ratioForSize(result?.size||imageConfig?.size||'1024x1024');return '<article class="image-task"><div class="image-preview" id="preview-'+index+'">'+(result?'<img src="'+esc(result.url)+'" alt="'+esc(task.screen_name)+'" />':'尚未生成')+'</div><div class="task-body"><div class="task-title"><h2>'+esc(task.screen_name)+'</h2><span class="badge '+(result?'success':'')+'">'+(result?'已生成':'待生成')+'</span></div><p class="task-copy">'+esc(task.purpose)+' · '+esc(task.layout)+'</p><p class="components">组件：'+(task.components||[]).map(esc).join('、')+'</p><div class="ratio-picker"><div class="ratio-picker-title">生成图片比例</div><div class="ratio-options" role="group" aria-label="生成图片比例">'+ratioOptionsMarkup(selected.ratio,index)+'</div><input type="hidden" id="size-'+index+'" value="'+selected.size+'" /></div><textarea class="prompt" id="prompt-'+index+'" aria-label="'+esc(task.screen_name)+'提示词">'+esc(result?.prompt||defaultPrompt(currentRun,task))+'</textarea><div class="task-actions"><button class="primary" data-generate="'+index+'" '+(enabled?'':'disabled')+'>生成图片</button><span class="task-status" id="status-'+index+'">'+(enabled?'': '请先启用图片模型')+'</span></div>'+(result?'<div class="image-meta">模型：'+esc(result.model)+' · '+esc(imageSizeLabel(result.size||selected.size))+(result.revised_prompt?' · 模型已优化提示词':'')+'</div>':'')+'</div></article>';}).join('')+'</div>';document.querySelectorAll('[data-ratio-button]').forEach(button=>button.onclick=()=>{const picker=button.closest('.ratio-picker');picker.querySelectorAll('[data-ratio-button]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',active?'true':'false');});picker.querySelector('input[type="hidden"]').value=button.dataset.size;});document.querySelectorAll('[data-generate]').forEach(button=>button.onclick=()=>generate(Number(button.dataset.generate),button));}
    async function generate(index,button){const task=currentRun.visual_tasks[index];const size=$('#size-'+index).value;button.disabled=true;button.textContent='生成中…';$('#status-'+index).textContent='图片模型正在处理';try{const response=await fetch('/api/images/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:currentRun.id,task_id:task.id,prompt:$('#prompt-'+index).value,size})});const data=await response.json();if(!response.ok)throw new Error(data.error||'图片生成失败');currentRun.generated_images=currentRun.generated_images||[];currentRun.generated_images.push(data);task.status='generated';render();$('#global-status').textContent='已生成 '+task.screen_name+' · '+imageSizeLabel(size);}catch(error){$('#status-'+index).textContent=error.message;button.disabled=false;button.textContent='重新生成';}}
    async function load(){const [configResponse,runsResponse]=await Promise.all([fetch('/api/config'),fetch('/api/runs')]);const config=await configResponse.json();runs=await runsResponse.json();if(!configResponse.ok)throw new Error(config.error||'配置读取失败');imageConfig=config.image;const enabled=imageConfig.provider==='openai_compatible';$('#model-state').textContent='图片模型：'+(enabled?imageConfig.model:'未启用');$('#model-state').classList.toggle('success',enabled);$('#provider-hint').innerHTML=enabled?'当前通过 <strong>'+esc(imageConfig.model)+'</strong> 生成图片。每个界面任务都可以选择屏幕比例与分辨率，默认使用 '+esc(imageSizeLabel(imageConfig.size))+'，质量 '+esc(imageConfig.quality)+'。':'尚未启用图片模型。请先前往 <a href="/web/model-settings.html">模型设置</a> 配置 OpenAI 兼容 Images API。';const available=runs.filter(run=>run.visual_tasks?.length);$('#run-select').innerHTML=available.length?available.map(run=>'<option value="'+esc(run.id)+'">'+esc(run.document?.title||run.request)+'</option>').join(''):'<option value="">暂无界面任务</option>';currentRun=available[0]||null;render();}
    $('#run-select').onchange=()=>{currentRun=runs.find(run=>run.id===$('#run-select').value)||null;render();};
    load().catch(error=>{$('#global-status').textContent=error.message;$('#tasks').innerHTML='<div class="empty">'+esc(error.message)+'</div>';});
  </script>
</body>
</html>
