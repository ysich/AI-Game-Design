<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner 测试用例</title><link rel="stylesheet" href="/web/portal.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">AI</span><span>Planner 测试用例</span></div><nav class="top-actions"><a href="/web/index.html">返回工作台</a><a href="/web/analytics.html">数据看板</a></nav></header><main class="page"><div class="title-row"><div><div class="eyebrow">Local Test Runner</div><h1>测试 Planner 用例</h1><p class="subtitle">逐条运行本地管线，快速确认需求路由、澄清和完整导出结果。</p></div></div><section class="panel"><div class="field"><label for="cases">测试输入（每行一条需求）</label><textarea id="cases" rows="8">做一个为期 7 天的回流玩家签到活动，提升回流率并给出界面和奖励方案。
做活动
设计一个社区任务活动，要求有分享和奖励。</textarea></div><div style="margin-top:14px"><button class="primary" id="run">开始测试</button><button class="button" id="clear" style="margin-left:8px">清空结果</button><span class="status" id="status"></span></div></section><section class="section panel"><h2>测试结果</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>输入</th><th>阶段</th><th>状态</th><th>检查记录</th><th>运行 ID</th></tr></thead><tbody id="results"><tr><td colspan="6" class="empty">尚未运行</td></tr></tbody></table></div></section></main><script>const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));$('#run').onclick=async()=>{const cases=$('#cases').value.split(/\n+/).map(request=>({request:request.trim()})).filter(item=>item.request);if(!cases.length){$('#status').textContent='请先输入测试内容';return}$('#run').disabled=true;$('#status').textContent='运行中…';const response=await fetch('/api/test-cases/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cases})});const data=await response.json();$('#results').innerHTML=data.results.map(r=>'<tr><td>'+r.index+'</td><td>'+esc(r.request)+'</td><td>'+esc(r.stage||'—')+'</td><td><span class="badge '+(r.status==='passed'?'success':r.status==='needs_review'?'warning':'error')+'">'+esc(r.status)+'</span><br><small>'+esc(r.message)+'</small></td><td>'+esc(r.findings??'—')+'</td><td>'+esc(r.run_id||'—')+'</td></tr>').join('');$('#status').textContent='完成 '+data.results.length+' 条';$('#run').disabled=false};$('#clear').onclick=()=>{$('#results').innerHTML='<tr><td colspan="6" class="empty">尚未运行</td></tr>';$('#status').textContent=''};</script></body></html>
